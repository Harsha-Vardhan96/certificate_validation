spring.application.name=application-service
server.port=8082

# Database Configuration (PostgreSQL 18 on port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/application_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.preferIpAddress=true

# JWT Secret (Must match auth-service)
app.jwt.secret=${JWT_SECRET:8f2a99d45e6c7104b901a113a37b678f24b2b2b1897c414c81ab7911b69389e9}
app.jwt.expiration=86400000

# Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=uploads/supporting-documents

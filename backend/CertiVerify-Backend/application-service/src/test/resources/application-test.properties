spring.application.name=application-service

# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:applicationdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Mock Eureka for testing
eureka.client.enabled=false

# JWT Secret
app.jwt.secret=8f2a99d45e6c7104b901a113a37b678f24b2b2b1897c414c81ab7911b69389e9
app.jwt.expiration=86400000

# Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=target/test-uploads

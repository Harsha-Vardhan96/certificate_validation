server.port=8083
spring.application.name=certificate-service

spring.datasource.url=jdbc:postgresql://localhost:5433/certificate_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

app.verification.base-url=http://localhost:8080/api/verify

# JWT configuration (consistent with auth-service and api-gateway)

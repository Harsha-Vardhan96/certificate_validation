server.port=8084
spring.application.name=verification-service

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/verification_db
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Internal API Key for interacting with Certificate Service
verification.certificate-service.internal-key=${CERTIFICATE_INTERNAL_SERVICE_KEY}

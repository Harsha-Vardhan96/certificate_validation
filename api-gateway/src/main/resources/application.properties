server.port=8080

spring.application.name=api-gateway

# Eureka configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Gateway routes

# Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Application Service
spring.cloud.gateway.routes[1].id=application-service
spring.cloud.gateway.routes[1].uri=lb://APPLICATION-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/applications/**

# Certificate Service
spring.cloud.gateway.routes[2].id=certificate-service
spring.cloud.gateway.routes[2].uri=lb://CERTIFICATE-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/certificates/**

# Verification Service
spring.cloud.gateway.routes[3].id=verification-service
spring.cloud.gateway.routes[3].uri=lb://VERIFICATION-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/verify/**

# JWT configuration
jwt.secret=${JWT_SECRET:8f2a99d45e6c7104b901a113a37b678f24b2b2b1897c414c81ab7911b69389e9}

# CORS configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type
server.port=8081

spring.application.name=auth-service

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5433/auth_db
spring.datasource.username=postgres
spring.datasource.password=root

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client Configuration
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# JWT Configuration
# In production, pass this via environment variable (e.g., JWT_SECRET)
jwt.secret=${JWT_SECRET:8f2a99d45e6c7104b901a113a37b678f24b2b2b1897c414c81ab7911b69389e9}
# 24 hours in milliseconds
jwt.expiration=86400000

# Demo Mode Configuration
app.demo-mode=${DEMO_MODE:false}

# Admin Bootstrap Configuration
app.bootstrap.admin.email=${ADMIN_EMAIL:admin@certiverify.com}
app.bootstrap.admin.password=${ADMIN_PASSWORD:admin123}
app.bootstrap.admin.name=${ADMIN_NAME:System Administrator}
